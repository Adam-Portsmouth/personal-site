<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Portsmouth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #2C5F5A;
    --ink: #1D1D1D;
    --offwhite: #F2EFE9;
    --rule: #E0DBD3;
    --midgrey: #8C8C8C;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100vh;
    overflow: hidden;
    background: var(--offwhite);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---------- Nav ---------- */
  nav {
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: transparent;
    padding: 28px 6vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .nav-btn {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--teal);
    padding: 10px 28px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
    display: inline-block;
  }

  .nav-btn:hover {
    background: var(--teal);
    color: var(--offwhite);
  }

  /* ---------- Hero ---------- */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-left: 6vw;
    padding-bottom: 48px;
    min-height: 0;
  }

  .hero-line {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: clamp(80px, 13vw, 140px);
    line-height: 1.0;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    white-space: nowrap;
  }

  #tw-word {
    display: inline-block;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.9em;
    background: var(--teal);
    margin-left: 4px;
    transform: translateY(0.08em);
    animation: blink 0.75s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }

  .dot {
    display: inline-block;
    color: var(--teal);
    font-size: 0.45em;
    vertical-align: 0.1em;
    margin-left: 0.06em;
    line-height: 1;
  }

  /* ---------- Rule + body line ---------- */
  .rule {
    flex-shrink: 0;
    border-top: 1px solid var(--rule);
  }

  .body-line {
    flex-shrink: 0;
    text-align: center;
    padding: 22px 6vw;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 1200px;
    margin: 0 auto;
  }

  .body-line .accent {
    font-weight: 500;
    color: var(--teal);
  }

  /* ---------- Countdown bar ---------- */
  .countdown {
    flex-shrink: 0;
    background: var(--teal);
    padding: 18px 6vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
  }

  .countdown-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--offwhite);
  }

  .countdown-units {
    display: flex;
    gap: 40px;
  }

  .unit {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .unit-num {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 48px;
    line-height: 1;
    color: var(--offwhite);
  }

  .unit-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .hero-line {
      font-size: clamp(56px, 12vw, 110px);
    }
    .countdown-units {
      gap: 28px;
    }
    .unit-num {
      font-size: 38px;
    }
  }

  @media (max-width: 700px) {
    nav {
      padding: 20px 6vw;
    }
    .nav-name {
      font-size: 11px;
    }
    .nav-btn {
      font-size: 11px;
      padding: 8px 18px;
      letter-spacing: 0.08em;
    }
    .hero {
      padding-bottom: 32px;
    }
    .hero-line {
      font-size: clamp(48px, 13vw, 88px);
    }
    .cursor {
      width: 2px;
      margin-left: 3px;
    }
    .body-line {
      font-size: 14px;
      padding: 18px 6vw;
      line-height: 1.6;
    }
    .countdown {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 6vw;
    }
    .countdown-units {
      width: 100%;
      justify-content: space-between;
      gap: 12px;
    }
    .unit {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .unit-num {
      font-size: 30px;
    }
    .unit-label {
      font-size: 9px;
      letter-spacing: 0.08em;
    }
  }

  @media (max-width: 420px) {
    nav {
      padding: 18px 5vw;
    }
    .nav-name {
      font-size: 10px;
      letter-spacing: 0.07em;
    }
    .nav-btn {
      font-size: 10px;
      padding: 7px 12px;
      letter-spacing: 0.06em;
    }
    .hero {
      padding-left: 5vw;
      padding-bottom: 24px;
    }
    .hero-line {
      font-size: clamp(40px, 13.5vw, 60px);
    }
    .body-line {
      font-size: 13px;
      padding: 14px 5vw;
      line-height: 1.55;
    }
    .countdown {
      padding: 14px 5vw;
      gap: 10px;
    }
    .unit-num {
      font-size: 26px;
    }
    .countdown-label {
      font-size: 10px;
      letter-spacing: 0.14em;
    }
  }

  @media (max-width: 340px) {
    .hero-line {
      font-size: clamp(34px, 13vw, 48px);
    }
    .unit-num {
      font-size: 22px;
    }
    .unit-label {
      font-size: 8px;
    }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-name">ADAM PORTSMOUTH</div>
    <a href="#" class="nav-btn">WELCOME BACK ↗</a>
  </nav>

  <section class="hero">
    <div class="hero-line">
      <span id="tw-word"></span><span class="cursor" aria-hidden="true"></span><span class="dot">●</span>
    </div>
  </section>

  <div class="rule"></div>

  <div class="body-line">
    Currently building my Learning & Development Consulting company.
  </div>

  <div class="countdown">
    <div class="countdown-label">YEAR COUNTDOWN</div>
    <div class="countdown-units">
      <div class="unit"><span class="unit-num" id="cd-days">000</span><span class="unit-label">DAYS</span></div>
      <div class="unit"><span class="unit-num" id="cd-hours">00</span><span class="unit-label">HOURS</span></div>
      <div class="unit"><span class="unit-num" id="cd-minutes">00</span><span class="unit-label">MINUTES</span></div>
      <div class="unit"><span class="unit-num" id="cd-seconds">00</span><span class="unit-label">SECONDS</span></div>
    </div>
  </div>

<script>
  /* ---------- Typewriter ---------- */
  (function () {
    const words = ['Husband', 'Father', 'L&D Consultant', 'L&D Contractor'];
    const TYPE_MS = 80;
    const DELETE_MS = 45;
    const PAUSE_END_MS = 1800;
    const PAUSE_NEXT_MS = 350;
    const START_DELAY_MS = 400;

    const target = document.getElementById('tw-word');
    let wordIndex = 0;

    function typeWord(word, cb) {
      let i = 0;
      function step() {
        target.textContent = word.slice(0, ++i);
        if (i < word.length) setTimeout(step, TYPE_MS);
        else cb();
      }
      step();
    }

    function deleteWord(cb) {
      const current = target.textContent;
      let i = current.length;
      function step() {
        target.textContent = current.slice(0, --i);
        if (i > 0) setTimeout(step, DELETE_MS);
        else cb();
      }
      if (i === 0) cb(); else step();
    }

    function loop() {
      const word = words[wordIndex];
      typeWord(word, function () {
        setTimeout(function () {
          deleteWord(function () {
            wordIndex = (wordIndex + 1) % words.length;
            setTimeout(loop, PAUSE_NEXT_MS);
          });
        }, PAUSE_END_MS);
      });
    }

    setTimeout(loop, START_DELAY_MS);
  })();

  /* ---------- Countdown ---------- */
  (function () {
    const daysEl = document.getElementById('cd-days');
    const hoursEl = document.getElementById('cd-hours');
    const minutesEl = document.getElementById('cd-minutes');
    const secondsEl = document.getElementById('cd-seconds');

    function pad(n, w) {
      const s = String(n);
      return s.length >= w ? s : '0'.repeat(w - s.length) + s;
    }

    const target = new Date('2026-07-31T23:59:59');

    function tick() {
      const now = new Date();
      let diff = target - now;
      if (diff < 0) diff = 0;

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days, 3);
      hoursEl.textContent = pad(hours, 2);
      minutesEl.textContent = pad(minutes, 2);
      secondsEl.textContent = pad(seconds, 2);
    }

    tick();
    setInterval(tick, 1000);
  })();
</script>

</body>
</html>
